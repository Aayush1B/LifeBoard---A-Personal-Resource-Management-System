{% extends "base.html" %}

{% block title %}404 Not Found — LifeBoard{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 60px auto; text-align: center;">
  <div class="card" style="padding: 40px;">
    <div style="font-size: 64px; color: var(--primary); margin-bottom: 16px;">
      <i class="fa-solid fa-compass"></i>
    </div>
    <h2 style="font-size: 24px; margin-bottom: 10px;">404 — Page Not Found</h2>
    <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 24px;">
      The page you requested could not be located on LifeBoard.
    </p>
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary">
      <i class="fa-solid fa-house"></i> Go to Dashboard
    </a>
  </div>
</div>
{% endblock %}
