{% extends "base.html" %}

{% block title %}500 Internal Error — LifeBoard{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 60px auto; text-align: center;">
  <div class="card" style="padding: 40px;">
    <div style="font-size: 64px; color: #dc2626; margin-bottom: 16px;">
      <i class="fa-solid fa-triangle-exclamation"></i>
    </div>
    <h2 style="font-size: 24px; margin-bottom: 10px;">500 — Server Error</h2>
    <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 24px;">
      Something unexpected occurred. Please try again in a moment.
    </p>
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary">
      <i class="fa-solid fa-house"></i> Return Home
    </a>
  </div>
</div>
{% endblock %}
